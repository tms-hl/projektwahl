<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Projektwahl</title>
        <link type = "text/css" rel="stylesheet" href="{{url_for('static', filename = 'style.css')}}">
        {% block head_extra %}{% endblock %}
    </head>
    <body>
        <header>
            <img src="{{url_for('static', filename = 'logo.png')}}" width="250" height="66">
            <h1>Projektwoche 2026</h1>
            <span>{{ current_user.vorname }} {{ current_user.nachname }}</span>
        </header>
        <nav>
            <a href="{{ url_for('projekte') }}">Projektübersicht</a>
            {% if is_organisator %}
                <a href="{{ url_for('neu') }}">neues Projekt</a>
            {% else %}
                <a href="{{ url_for('wahl') }}">meine Wahl</a>
            {% endif %}
        </nav>
        {% block content %}
        {% endblock %}
        
        <footer>Ein Projekt des Informatikkurses E und Q1 der TMS</footer>
    </body>
</html>
